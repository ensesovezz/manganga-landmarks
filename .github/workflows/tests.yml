name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # El repo incluye ~565 MB de imágenes: no hacen falta para los tests
          # (usan máscaras sintéticas).
          sparse-checkout: |
            manganga
            tests
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless scipy scikit-learn pandas pillow typer rich tqdm pytest
          pip install -e . --no-deps

      - name: Tests
        run: pytest tests/ -q
